# La compilación va a la caché del usuario, no dentro del repo (ver docs/rust-migracion.md).
# Relativo a vista-escritorio/ — da ~/.cache/gigishell/cargo/vista-escritorio con el repo en ~/GiGiShell.
# instalar.sh usa la misma ruta a mano (CARGO_TARGET_DIR): si cambia aquí, cambiarla allí.
[build]
target-dir = "../../.cache/gigishell/cargo/vista-escritorio"
