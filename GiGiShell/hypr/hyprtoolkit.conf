# Paleta de hyprtoolkit — el aspecto de TODAS las apps hyprtoolkit del sistema,
# no solo del agente de polkit (hoy también hyprland-guiutils). Se enlaza solo:
# ~/.config/hypr es symlink a ~/GiGiShell/hypr, así que este fichero ya cae en la
# ruta que busca hyprtoolkit ($XDG_CONFIG_HOME/hypr/hyprtoolkit.conf).
#
# Los valores ESPEJAN ags/estilos/_colores.scss, que es la fuente de verdad del
# shell. Si cambias un color allí, cámbialo aquí — no hay nada que sincronice
# los dos ficheros, y no puede haberlo: hyprtoolkit lee hyprlang y el shell SCSS.
#
# Formato de color: 0xAARRGGBB (alfa primero), NO el #RRGGBB del SCSS.
#
# Se RECARGA EN CALIENTE: hyprtoolkit vigila este fichero con inotify, así que la
# siguiente ventana ya sale con los valores nuevos sin reiniciar nada.
#
# YA ESTÁ ACTIVO, aunque el agente de polkit todavía no lo use. La hyprtoolkit
# 0.5.4 de los repos trae el mismo lector de config (verificado: la propia lib
# nombra "$XDG_CONFIG_HOME/hypr/hyprtoolkit.conf" y reconoce estas claves), así
# que la paleta la aplica hoy hyprland-guiutils, el otro consumidor instalado.
#
# EL AGENTE DE POLKIT ES EL QUE FALTA, y es cuestión de versión, no de este
# fichero: el hyprpolkitagent 0.1.3 de los repos es el viejo Qt/QML, lleva el QML
# compilado dentro del binario y no lee configuración de ninguna clase. Upstream
# ya lo reescribió en hyprtoolkit, pero esa reescritura vive en `main` SIN TAG
# (el último sigue siendo v0.1.3), así que a los repos aún no ha llegado. Cuando
# taguen y llegue a extra/, esta paleta y hyprpolkitagent/hyprpolkitagent.conf
# empiezan a mandar sobre el diálogo de contraseña sin tocar nada más.
#
# Se probó la vía AUR (hyprpolkitagent-git) y se revirtió a propósito; el porqué
# está en la sección de polkit de CLAUDE.md.

# --- Colores -----------------------------------------------------------------
# background: el fondo de la ventana. $bg-bar rgba(8,8,12).
background       = 0xFF08080C
# base: superficies elevadas (campos, paneles). $bg-shell-grafito rgb(24,24,32).
base             = 0xFF181820
# alternate_base: la variante de base para filas alternas y hover. Equivale al
# $bg-pill (blanco al 7 %) ya resuelto sobre el grafito, porque aquí no hay alfa
# compuesto: hyprtoolkit quiere un color opaco.
alternate_base   = 0xFF232330
# text / bright_text: $text #e2e2e2 y $white para lo que debe destacar.
text             = 0xFFE2E2E2
bright_text      = 0xFFFFFFFF
# accent: $blue #89b4fa — el mismo azul que la barra usa para lo activo.
accent           = 0xFF89B4FA
# accent_secondary: $violet #cba6f7.
accent_secondary = 0xFFCBA6F7
# link_text: $teal #94e2d5. El defecto de hyprtoolkit es un cian chillón.
link_text        = 0xFF94E2D5

# --- Formas ------------------------------------------------------------------
# El shell tira de $radius-pill (999px) para las píldoras, pero eso es para
# elementos de barra: un diálogo con esquinas de píldora quedaría deforme. Estos
# valores acompañan al rounding 6 de gigios/ventanas.lua sin ir tan justos.
rounding_large   = 12
rounding_small   = 8

# --- Tipografía --------------------------------------------------------------
# Misma familia que qt6ct/qt6ct.conf, para que las apps Qt y las hyprtoolkit no
# se vean de dos escritorios distintos. La MesloLGS Nerd Font del shell es solo
# para iconos ($font-icon), no para texto corrido, así que aquí no pinta nada.
font_family           = Noto Sans
font_family_monospace = Noto Sans Mono
icon_theme            = Tela-circle-grey

# h1 es el título del diálogo ("Autenticación requerida"). El defecto (19) es lo
# que hace que la ventana de la versión Qt parezca gritar; 15 lo deja en peso de
# encabezado sin dominar la ventana entera.
h1_size          = 15
h2_size          = 13
h3_size          = 12
font_size        = 11
small_font_size  = 10
