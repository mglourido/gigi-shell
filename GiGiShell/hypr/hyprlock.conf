# El lanzador prepara el primer fondo antes de abrir hyprlock. El selector
# devuelve después una ruta distinta cada 30 s, sin repetir hasta agotar la cola.
background {
    monitor =
    path = ~/.cache/gigishell/hyprlock-fondo
    color = rgb(111522)
    # Hyprlock solo desenfoca el fondo completo, no una shape individual.
    blur_passes = 1
    blur_size = 4
    contrast = 0.8916
    brightness = 0.78
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
    reload_time = 30
    reload_cmd = ~/.config/hypr/scripts/fondo-bloqueo.py siguiente
    crossfade_time = 1.2
}

general {
    ignore_empty_input = false
    immediate_render = true
}

# Un solo bloque de texto: la fecha se centra bajo la hora y no queda espacio
# vacío de una tarjeta al cambiar el tamaño de fuente o la escala del monitor.
label {
    monitor =
    text = cmd[update:10000] date '+<span size="20000">%H:%M</span>%n<span size="9000">%d/%m/%Y</span>'
    color = rgba(255, 255, 255, 0.94)
    font_size = 12
    font_family = Noto Sans Mono
    text_align = center
    position = 24, 24
    halign = left
    valign = bottom
    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.82)
    zindex = 1
}

# Tarjeta de acceso compacta. El avatar opcional no desplaza el campo.
shape {
    monitor =
    size = 312, 94
    color = rgba(255, 255, 255, 0.10)
    rounding = 14
    border_size = 1
    border_color = rgba(255, 255, 255, 0.18)
    shadow_passes = 0
    position = 0, 0
    halign = center
    valign = center
}

# Copia compartida con Ajustes > Cuenta; se omite si no existe.
image {
    monitor =
    path = ~/.local/share/gigishell/face.png
    border_size = 1
    border_color = rgba(255, 255, 255, 0.35)
    size = 26
    rounding = -1
    position = 130, 26
    halign = center
    valign = center
}

label {
    monitor =
    text = <b>$USER</b>
    color = rgba(255, 255, 255, 0.94)
    font_size = 14
    font_family = Noto Sans
    position = 0, 26
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(0, 0, 0, 0.75)
    zindex = 1
}

input-field {
    monitor =
    size = 274, 40
    outline_thickness = 1
    outer_color = rgba(255, 255, 255, 0.22)
    inner_color = rgba(0, 0, 0, 0.32)
    font_color = rgba(255, 255, 255, 0.95)
    font_family = Noto Sans
    dots_size = 0.26
    dots_spacing = 0.24
    dots_center = true
    fade_on_empty = false
    hide_input = false
    rounding = 10
    placeholder_text = Contraseña
    check_color = rgb(137, 180, 250)
    check_text = Comprobando…
    fail_color = rgb(f38ba8)
    fail_text = No se pudo desbloquear
    capslock_color = rgb(f9e2af)
    # El borde cambia a ámbar cuando Bloq Num está APAGADO.
    numlock_color = rgb(fab387)
    invert_numlock = true
    position = 0, -16
    halign = center
    valign = center
    zindex = 1
}
