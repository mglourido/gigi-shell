#aqui se gestio los modos de ahorro de pantalla-> suspensión , bajar brillo ...
#─────────────────────────────────────────────
# ESTE FICHERO SIGUE EN HYPRLANG A PROPÓSITO: hypridle es un binario aparte y NO
# tiene intérprete Lua (0.1.7 enlaza solo libhyprlang, verificado con ldd). La
# migración a Lua es del compositor, no de la familia hypr* entera.
#
# Los on-timeout NO llaman a la acción directamente: pasan por
# scripts/idle-action.sh, que la ejecuta salvo que la función "Wake up" del menú
# de la barra la esté vetando (hypridle no sabe de Wake up). Sin estado, el script
# ejecuta la acción de siempre, así que esto se comporta igual que antes.
# LOS TIEMPOS NO SE EDITAN AQUÍ. Este fichero es estático y nadie lo reescribe en
# ejecución (antes AGS cambiaba los `timeout =` a mano y cada ajuste salía en
# `gigishell status`). Los números vienen de variables `$IDLE_*`:
#   1. los valores POR DEFECTO, justo aquí debajo;
#   2. el `source =` de ~/.cache/gigishell/hypridle.conf, que los pisa. Lo genera
#      scripts/hypridle.sh a partir de ~/.config/gigishell/inactividad.json (que
#      escribe Ajustes > Pantalla y el modo ahorro) cada vez que arranca hypridle.
# Por eso hypridle se lanza SIEMPRE con scripts/hypridle.sh, nunca a pelo: a pelo
# arrancaría con los valores por defecto. Si el derivado falta, hyprlang avisa
# ("source= globbing error") y sigue con los de aquí — no rompe.
# Un listener APAGADO vale -1: hypridle lo descarta como "missing timeout".
#
# OJO al escribir comandos aquí: nada de `{ }` dentro de un listener, y no por
# hyprlang (que las aguanta) sino por la historia de abajo — el comando con llaves
# vive en idle-action.sh y así debe seguir.
#
# ⚠️ El peor fallo que ha tenido este fichero: para esquivar las llaves (el parser
# de AGS de entonces troceaba por `listener\s*\{[^}]*\}`) se escribía
# `hl.dsp.dpms('on')`, Y ESA FORMA ES UN TOGGLE — un string no es una tabla,
# `tableToggleAction()` devuelve TOGGLE y el 'on' se tira a la basura, respondiendo
# `ok`. El on-resume APAGABA la pantalla al volver de la suspensión. Ver la cabecera
# de dpms_on()/dpms_off() en idle-action.sh para el detalle completo.
#─────────────────────────────────────────────
# Valores por defecto (segundos; -1 = apagado). Deben coincidir con
# INACTIVIDAD_POR_DEFECTO de ags/servicios/pantalla/hypridle.ts.
$IDLE_DPMS = 600
$IDLE_LOCK = 660
$IDLE_SUSPEND = 2400
$IDLE_HIBERNATE = -1
$IDLE_ANTES_DE_DORMIR =
source = ~/.cache/gigishell/hypridle.conf

general {
    # NO se llama a `hyprlock` a pelo: el bloqueo entra siempre por bloquear.sh,
    # que sortea el fondo (hyprlock.conf no puede hacerlo: hyprlang no sustituye
    # comandos) y lleva dentro la guarda de instancia única. hyprlock NO tiene
    # guarda propia (0.9.6: ni una cadena "already running" en el binario), así que
    # lanzarlo dos veces arranca dos procesos de verdad — y con el listener de
    # bloqueo encendido eso pasa solo: bloquea a los 11 min y a los 20 el suspend
    # lanzaría un SEGUNDO hyprlock encima. El `pidof` que recomienda el ejemplo de
    # /usr/share/hypr/hypridle.conf sigue estando, pero una sola vez y en el script.
    lock_cmd = ~/.config/hypr/scripts/bloquear.sh
    # Va por logind y NO llama a hyprlock directo: así el bloqueo antes de suspender
    # entra por lock_cmd — un solo camino, y con la guarda de arriba ya aplicada.
    #
    # La enciende y apaga "Bloquear al suspender" (Ajustes > Pantalla > Suspensión)
    # vía $IDLE_ANTES_DE_DORMIR: vacío = sin comando, igual que no tener la línea.
    # Es un ajuste APARTE del listener de bloqueo: aquel cuenta inactividad, este
    # se dispara en CUALQUIER suspensión (menú de energía, botón de encendido,
    # tapa, `systemctl suspend`), porque quien avisa a hypridle es logind. Apagar
    # el listener y seguir viendo hyprlock al despertar era exactamente esto.
    before_sleep_cmd = $IDLE_ANTES_DE_DORMIR
    # Pasa por el script para poder mandar la TABLA (`{ action = 'on' }`): la forma
    # de cadena era un toggle disfrazado y apagaba la pantalla en vez de
    # encenderla. Ver la cabecera del fichero y dpms_on() en idle-action.sh.
    #
    # Aquí hubo un `| grep -q "^ok" || hyprctl dispatch dpms on` como repliegue a la
    # sintaxis legacy. Era doblemente inútil: bajo config Lua esa forma falla
    # (`')' expected near 'on'`, rc=7), y el toggle respondía "ok" siempre, así que
    # el repliegue no llegaba a ejecutarse ni cuando el comando hacía lo contrario
    # de lo que decía. Un guardián que solo sabe decir que sí.
    after_sleep_cmd = ~/.config/hypr/scripts/idle-action.sh dpms-on

    # inhibit_sleep se deja SIN PONER (defecto = 2, "auto") a propósito. El 3
    # ("lock notify") retiene el inhibidor de suspensión hasta que la sesión
    # Wayland está realmente bloqueada — la garantía más fuerte de que el PC no se
    # duerme antes de que hyprlock pinte —, pero si hyprlock no llegara a arrancar
    # ese bloqueo NO expira: el PC no se suspendería jamás, en silencio y sin UI
    # donde apagarlo. Es exactamente el modo de fallo que la puerta del Wake up
    # evita a propósito (ver la REGLA DE ORO de idle-action.sh), así que no se
    # cambia el defecto por una carrera de milisegundos. Valores medidos en 0.1.7:
    # 0=disable, 1=normal, 2=auto, 3=lock notify (4 → "Invalid inhibit_sleep value").
}

#apagar pantalla / el OS ya libera ram si puede auto
listener {
    timeout = $IDLE_DPMS
    on-timeout = ~/.config/hypr/scripts/idle-action.sh dpms-off
    # on-resume SÍ pasa por idle-action.sh, pero por su acción `dpms-on`, que es la
    # única que NO consulta al Wake up: encender la pantalla al volver no se veta
    # nunca. El rodeo es por las llaves de la tabla, que no pueden estar en este
    # bloque (ver cabecera). Sigue siendo lo único que la despierta si vuelves con
    # el ratón (mouse_move_enables_dpms = false en gigishell/ventanas.lua; solo una
    # tecla la enciende por su cuenta).
    on-resume = ~/.config/hypr/scripts/idle-action.sh dpms-on
}

#mandar al lock
listener {
    timeout = $IDLE_LOCK
    on-timeout = ~/.config/hypr/scripts/idle-action.sh lock
}

#suspender pc
listener {
    timeout = $IDLE_SUSPEND
    on-timeout = ~/.config/hypr/scripts/idle-action.sh suspend
}

#hibernar (camino MINORITARIO: ver abajo)
listener {
    timeout = $IDLE_HIBERNATE
    # Este listener SOLO se enciende cuando hibernar por inactividad no puede pasar por la
    # suspensión: o el listener de suspensión está apagado, o el tiempo de hibernación es
    # MENOR o igual que el de suspensión. En el caso normal (hibernar más tarde que suspender)
    # queda apagado, y quien cuenta es systemd: `suspend-then-hibernate` arma una alarma RTC
    # antes de dormirse y el equipo despierta solo para hibernar.
    #
    # Y no es una elección de estilo, es que NO HAY ALTERNATIVA: durante un S3 el userspace está
    # congelado — hypridle incluido —, así que ningún timer de aquí puede vencer estando el
    # equipo suspendido. Un `timeout = 3000` con suspensión a los 20 min no se dispararía nunca,
    # sin error ninguno. Por eso Ajustes enseña UN solo número (el total de inactividad) y elige
    # por dentro cuál de los dos mecanismos lo cumple; lo escribe
    # ags/servicios/energia/hibernacion.ts (vía inactividad.json).
    on-timeout = ~/.config/hypr/scripts/idle-action.sh hibernate
}
