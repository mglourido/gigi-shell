# Solo se usa cuando GiGiShell tiene una ubicación permitida y válida.
source = ~/.config/hypr/hyprlock.conf

# Tarjeta a juego con la del reloj. Ancho fijo pensado para
# "21 °C  ·  Parcialmente nuboso"; una descripción más larga sobresale.
shape {
    monitor =
    size = 230, 62
    color = $tinte
    rounding = 12
    border_size = 1
    border_color = $tinte_borde
    position = -12, 12
    halign = right
    valign = bottom
}

label {
    monitor =
    text = TIEMPO
    color = rgba(255, 255, 255, 0.88)
    font_size = 9
    font_family = Noto Sans
    position = -24, 49
    halign = right
    valign = bottom
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(0, 0, 0, 0.75)
    zindex = 1
}

label {
    monitor =
    text = cmd[update:600000] ~/.config/hypr/scripts/tiempo-bloqueo.py
    color = rgba(255, 255, 255, 0.94)
    font_size = 11
    font_family = Noto Sans
    position = -24, 24
    halign = right
    valign = bottom
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(0, 0, 0, 0.75)
    zindex = 1
}
