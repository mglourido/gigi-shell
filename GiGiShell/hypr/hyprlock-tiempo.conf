# Solo se usa cuando GiGiShell tiene una ubicación permitida y válida.
source = ~/.config/hypr/hyprlock.conf

# El mismo tratamiento sin tarjeta que el reloj, alineado a la derecha.
label {
    monitor =
    text = TIEMPO
    color = rgba(255, 255, 255, 0.88)
    font_size = 9
    font_family = Noto Sans
    position = -24, 49
    halign = right
    valign = bottom
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(0, 0, 0, 0.75)
    zindex = 1
}

label {
    monitor =
    text = cmd[update:600000] ~/.config/hypr/scripts/tiempo-bloqueo.py
    color = rgba(255, 255, 255, 0.94)
    font_size = 11
    font_family = Noto Sans
    position = -24, 24
    halign = right
    valign = bottom
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(0, 0, 0, 0.75)
    zindex = 1
}
