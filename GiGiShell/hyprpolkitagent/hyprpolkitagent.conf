# Geometría del diálogo de autenticación de polkit (la ventana que pide la
# contraseña de root). Sintaxis hyprlang. Todo lo que no esté aquí cae al
# defecto, así que solo se escriben las claves que se apartan de él.
#
# ESTO NO CONTROLA EL ASPECTO. Colores, redondeo, fuentes y tamaños de texto
# salen de la paleta de hyprtoolkit, que es un fichero aparte y compartido con
# las demás apps hyprtoolkit: hypr/hyprtoolkit.conf en este mismo repo. Buscar
# aquí un `accent =` es el error fácil.
#
# Se lee UNA VEZ AL ARRANCAR el agente, al revés que la paleta (que se recarga
# en caliente por inotify). Tras tocar este fichero:
#   pkill hyprpolkitagent && setsid nohup /usr/lib/hyprpolkitagent/hyprpolkitagent >/dev/null 2>&1 &
# o cerrar sesión. Es el mismo tropiezo que documenta CLAUDE.md para los
# *-monitor.sh: el proceso vivo sigue con los valores con los que nació.
#
# Requiere hyprpolkitagent reescrito en hyprtoolkit (AUR hyprpolkitagent-git).
# El 0.1.3 de los repos oficiales es Qt/QML y no lee ninguna configuración: el
# QML va compilado dentro del binario. Ver la sección de polkit en CLAUDE.md.

general {
    # Defectos: 520x440, campo de 340. El diálogo solo tiene título, descripción,
    # un campo y dos botones, así que 440 de alto deja un hueco muerto grande
    # cuando el panel de detalles está plegado. Se recorta a algo proporcionado
    # sin apretar el texto de acciones largas (los `Authentication is needed to
    # run '...'` de systemctl ocupan dos líneas de sobra).
    #
    # OJO: `window_width` NO HACE NADA, medido con A/B en 0.1.3.r11 — la ventana
    # sale a 460 px de ancho tanto pidiendo 500 como 700, porque el ancho lo fija
    # el contenido del layout. `window_height` sí manda (380 → 388, 520 → 528: un
    # +8 constante de margen). Se deja escrito el ancho para no tener que
    # redescubrir que se ignora, no porque surta efecto: si algún día upstream lo
    # respeta, 500 es el valor que se quiere.
    window_width         = 500
    window_height        = 380
    password_field_width = 320

    # Deja plegable el panel con la acción y el comando exactos. Se conserva
    # activado a propósito: es la única forma de ver QUÉ te está pidiendo root
    # antes de teclear la contraseña, y esa comprobación es justo lo que hace
    # que un prompt inesperado se pueda distinguir de uno legítimo.
    show_details         = true
}
