[package]
name = "gigishell-notif-respaldo"
version = "0.1.0"
edition = "2021"
description = "Guarda en disco las notificaciones que llegan con AGS caído (activación D-Bus de org.freedesktop.Notifications)"
publish = false

[dependencies]
serde_json = "1"
zbus = "5"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Mismo criterio que eventd: backtraces con fichero y línea, sin el resto de la info de depuración.
[profile.dev]
debug = "line-tables-only"
