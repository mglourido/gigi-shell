[package]
name = "gigishell-eventd"
version = "0.1.0"
edition = "2021"
description = "Monitor de eventos del journal de GiGiShell (sustituye monitor_kernel + monitor_system de oom-monitor.sh)"
publish = false

[dependencies]
libc = "0.2"
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
