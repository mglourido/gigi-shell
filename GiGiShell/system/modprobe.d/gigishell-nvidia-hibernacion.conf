# /etc/modprobe.d/gigishell-nvidia-hibernacion.conf — hibernación con GPU NVIDIA.
#
# Sin esto, hibernar con la NVIDIA cargada da PANTALLA NEGRA o cuelgue al volver, y no un error:
# el driver propietario no guarda por su cuenta el contenido de la VRAM, así que al restaurar la
# imagen las asignaciones de vídeo ya no existen. `NVreg_PreserveVideoMemoryAllocations=1` le manda
# volcarlas a disco (hasta el tamaño de la VRAM: 12 GB en la RTX 3060 de este equipo) y recuperarlas
# al despertar, que es lo que hacen los servicios nvidia-suspend/hibernate/resume del propio
# paquete — por eso install.sh los activa junto con este fichero: uno sin lo otro no sirve.
#
# NVreg_TemporaryFilePath es DÓNDE cae ese volcado. El defecto es /tmp, que en esta máquina (y en
# casi todo Arch moderno) es un tmpfs: guardar la VRAM en RAM justo cuando se está intentando
# escribir la RAM entera al swap es exactamente lo contrario de lo que hace falta. /var/tmp está en
# el btrfs del sistema y sobrevive al reinicio, que es el requisito real.
#
# Módulo `nvidia`, no `nvidia-drm`: el otro fichero de esta carpeta (/etc/modprobe.d/nvidia.conf,
# ajeno a GiGiShell) configura `nvidia-drm modeset=1 fbdev=1` y son opciones de módulos DISTINTOS, así
# que no se pisan. Se instala aparte para no reescribir un fichero que no es nuestro.
#
# Hace falta regenerar el initramfs después de tocarlo (`mkinitcpio -P`): el módulo nvidia se carga
# desde el initramfs por el hook `kms`, y quien mete /etc/modprobe.d ahí dentro es el hook `modconf`.
# Editar esto sin regenerar no da ningún error; simplemente la opción no llega al módulo.
options nvidia NVreg_PreserveVideoMemoryAllocations=1 NVreg_TemporaryFilePath=/var/tmp
