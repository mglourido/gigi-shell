name: Validar GiGiShell

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # El preflight en modo checkout no necesita Node ni Hyprland: comprueba que
      # están todos los ficheros versionados, que los scripts Bash/Python parsean y
      # que los módulos Lua que carga hyprland.lua existen. Es exactamente lo que
      # falla cuando un commit se deja algo suelto.
      - name: Validar archivos y scripts
        run: GiGiShell/bin/preflight.sh
      # NO hay paso de tests, y no es un olvido: ningún test se versiona (son de
      # desarrollo momentáneo, ver .gitignore), así que en un checkout de CI no existe
      # ninguno que ejecutar. Los tests se corren en la máquina donde se escriben.
